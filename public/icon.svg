<?xml version="1.0" encoding="utf-8"?>
<!--
  ShopFinder — Brand mark. Minimal magnifying glass.

  Concept: "Finder". A magnifying glass = search/discovery.
  The emerald dot inside the lens = "product found".

  No gradients. No pipeline narrative. No monogram. Just a clean,
  geometric magnifying glass that survives at 16×16, in monochrome
  print, embroidery, and stickers.

  Canvas: 512×512. Slate-900 background, emerald magnifying glass.
  Strokes are intentionally bold (40-48px) for small-size legibility.
-->
<svg version="1.0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background: rounded square, slate-900 -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="#0F172A"/>

  <!-- Magnifying glass lens (emerald ring, bold stroke) -->
  <circle cx="210" cy="210" r="100" fill="none" stroke="#10B981" stroke-width="40"/>

  <!-- "Found" dot — product found inside the lens -->
  <circle cx="210" cy="210" r="34" fill="#10B981"/>

  <!-- Handle — 45° angle, thick, round cap -->
  <line x1="284" y1="284" x2="396" y2="396" stroke="#10B981" stroke-width="48" stroke-linecap="round"/>
</svg>
