# CodeQL — Static Analysis (SAST) for JavaScript/TypeScript
#
# REPO PRIVADO: o upload de resultados exige GitHub Advanced Security
# (Settings → Code security → Advanced Security). Enquanto não estiver
# habilitado, o workflow fica manual (workflow_dispatch) — o job falhava
# em todo push com "Code scanning is not enabled for this repository".
# Após habilitar GHAS, restaurar os triggers de push/PR/schedule abaixo.
#
# Reference: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/setting-up-code-scanning-for-a-repository

name: "CodeQL"

on:
  workflow_dispatch:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Default queries suite covers security + correctness.
          # For stricter analysis, swap to `security-extended`.
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
