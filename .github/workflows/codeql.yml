# CodeQL — Static Analysis (SAST) for JavaScript/TypeScript
#
# GHAS liberado (billing resolvido 12/09/2026 — dispatch validado com
# sucesso). Triggers de push/PR/semanal ativos.
#
# Reference: https://docs.github.com/en/code-security/code-scanning-for-vulnerabilities-and-errors/setting-up-code-scanning-for-a-repository

name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.0
        with:
          languages: ${{ matrix.language }}
          # Default queries suite covers security + correctness.
          # For stricter analysis, swap to `security-extended`.
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.38.0
        with:
          category: "/language:${{ matrix.language }}"
