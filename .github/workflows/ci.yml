name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run unit tests with coverage
        run: bun test tests/unit --coverage --coverage-reporter=lcov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false # gate 60% ativado no painel após baseline estável (#28)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run integrity tests
        run: python3 -m unittest discover -s tests -p test_protocolo_integrity.py
  lint:
    # (#36) ESLint 9.27 — versão cujo @eslint/config-array usa minimatch@3,
    # contornando o bug de link do bun com brace-expansion@5 (minimatch@10).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run ESLint
        run: bunx eslint .
  build:
    # (#36) Build de produção — valida compilação (Turbopack), páginas
    # estáticas e standalone output. Sitemap consulta o banco no build.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shopfinder
          POSTGRES_PASSWORD: shopfinder
          POSTGRES_DB: shopfinder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://shopfinder:shopfinder@localhost:5432/shopfinder_test
      NEXTAUTH_SECRET: ci-build-nextauth-secret-not-a-real-credential
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Sync database schema (sitemap consulta no build)
        run: bunx prisma db push --skip-generate
      - name: Build
        run: bunx next build
  integration:
    # (#36) Testes de integração (bun:test) contra dev server + Postgres.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shopfinder
          POSTGRES_PASSWORD: shopfinder
          POSTGRES_DB: shopfinder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://shopfinder:shopfinder@localhost:5432/shopfinder_test
      NEXTAUTH_SECRET: ci-integration-nextauth-secret-not-a-real-credential
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      TEST_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Sync database schema
        run: bunx prisma db push --skip-generate
      - name: Seed catalog
        # Apenas seed-catalog: ele cria store (id fixo), admin, países/moedas
        # e produtos. seed.ts criaria um segundo store "default" e colidiria
        # no unique de slug em banco novo.
        run: bun run scripts/seed-catalog.ts
      - name: Start dev server
        run: |
          nohup bunx next dev -p 3000 > dev-server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:3000/api/health > /dev/null || (cat dev-server.log && exit 1)
      - name: Run integration tests
        run: bun test tests/integration
      - name: Dump dev server log
        if: failure()
        run: cat dev-server.log
  knip:
    # Dead-code (#29): teto de 150 issues (atual: ~120 — deps de scaffold
    # shadcn/ui + exports previstos para módulos futuros). Triagem reduz o
    # teto até virar bloqueio estrito (--max-issues 0).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run Knip
        run: bunx knip --max-issues 150
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write # gitleaks-action posta status de commit no PR
    steps:
      - uses: actions/checkout@v4
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shopfinder
          POSTGRES_PASSWORD: shopfinder
          POSTGRES_DB: shopfinder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://shopfinder:shopfinder@localhost:5432/shopfinder_test
      NEXTAUTH_SECRET: ci-e2e-nextauth-secret-not-a-real-credential
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      E2E_ADMIN_EMAIL: e2e-admin@shopfinder.test
      E2E_ADMIN_PASSWORD: e2eAdminPass123
      TEST_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Sync database schema
        run: bunx prisma db push --skip-generate
      - name: Seed catalog
        # Apenas seed-catalog: ele cria store (id fixo), admin, países/moedas
        # e produtos. seed.ts criaria um segundo store "default" e colidiria
        # no unique de slug em banco novo.
        run: bun run scripts/seed-catalog.ts
      - name: Create E2E admin user
        run: bun run scripts/create-admin.ts --email "$E2E_ADMIN_EMAIL" --password "$E2E_ADMIN_PASSWORD"
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Run E2E tests
        run: bunx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
