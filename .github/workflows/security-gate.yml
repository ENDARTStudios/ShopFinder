name: Security Gate

on:
  pull_request:
    branches: [main]

jobs:
  security-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write # gitleaks-action posta status de commit no PR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # npm não suporta o protocolo workspace:* dos workspaces — instalação via bun
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Architecture contract
        run: bun run test:arch --if-present
      - name: Audit (zero high+)
        # GHSA-ggr8-5vv4-36mx (deepmerge-ts via cadeia prisma): stack exhaustion
        # exige input recursivo hostil no merge — triada, upgrade acompanhado
        # no backlog de dependências.
        run: bun audit --audit-level=high --ignore=GHSA-ggr8-5vv4-36mx
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
