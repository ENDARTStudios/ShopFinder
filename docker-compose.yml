# Docker Compose — ShopFinder Production Infrastructure
#
# Usage:
#   docker compose up -d                    # Start all services
#   docker compose up -d postgres pgbouncer # Start PostgreSQL + PgBouncer only
#   docker compose up -d minio              # Start MinIO (Object Storage)
#   docker compose up -d pgadmin            # Start pgAdmin (optional, --profile pgadmin)
#   docker compose down                     # Stop all services
#   docker compose down -v                  # Stop + delete volumes
#
# Connection strings:
#   PostgreSQL (direct):  postgresql://aicommerce:aicommerce@localhost:5432/aicommerce?schema=public
#   PostgreSQL (pooled):  postgresql://aicommerce:aicommerce@localhost:6432/aicommerce?schema=public
#   MinIO S3 endpoint:    http://localhost:9000
#   MinIO Console:        http://localhost:9001 (minioadmin / minioadmin)

services:
  postgres:
    image: postgres:17-alpine
    container_name: aicommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aicommerce
      POSTGRES_PASSWORD: aicommerce
      POSTGRES_DB: aicommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicommerce -d aicommerce"]
      interval: 5s
      timeout: 5s
      retries: 5
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "log_min_duration_statement=200"  # log slow queries (>200ms)
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: aicommerce-pgbouncer
    restart: unless-stopped
    environment:
      DB_USER: aicommerce
      DB_PASSWORD: aicommerce
      DB_HOST: postgres
      DB_NAME: aicommerce
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 20
      RESERVE_POOL_SIZE: 5
      RESERVE_POOL_TIMEOUT: 3
      SERVER_RESET_QUERY: DISCARD ALL
      AUTH_TYPE: scram-sha-256
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    container_name: aicommerce-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  minio-init:
    image: minio/mc:latest
    container_name: aicommerce-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/aicommerce-raw-payloads --ignore-existing;
      mc mb local/aicommerce-inference-artifacts --ignore-existing;
      mc mb local/aicommerce-provider-responses --ignore-existing;
      mc mb local/aicommerce-images --ignore-existing;
      mc mb local/aicommerce-snapshots --ignore-existing;
      echo 'Buckets created successfully';
      "
    restart: "no"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: aicommerce-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@aicommerce.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - pgadmin

  redis:
    image: redis:7-alpine
    container_name: aicommerce-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local
